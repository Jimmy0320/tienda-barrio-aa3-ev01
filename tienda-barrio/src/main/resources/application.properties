# =============================================
# CONFIGURACION BASE DE DATOS MySQL
# =============================================
# Base de datos independiente para la evidencia GA7-220501096-AA3-EV01
# (misma estructura que `tienda_barrio`, ver tienda_barrio_aa3.sql)
spring.datasource.url=jdbc:mysql://localhost:3306/tienda_barrio_aa3?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password="Tu Contrase\u00f1a Aqui"
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# CONFIGURACION JPA / HIBERNATE
# =============================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =============================================
# CONFIGURACION DEL SERVIDOR
# =============================================
server.port=8080
server.servlet.context-path=/api

# =============================================
# CONFIGURACION JWT
# =============================================
jwt.secret=TiendaBarrioSecretKey2025JimmyRamosProyecto
jwt.expiration=86400000

# =============================================
# CONFIGURACION GENERAL
# =============================================
spring.jackson.serialization.fail-on-empty-beans=false

# =============================================
# LOGS (quitar en produccion)
# =============================================
logging.level.com.tienda=DEBUG
logging.level.org.springframework.web=DEBUG